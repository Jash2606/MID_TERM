apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shop-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: <DOCKERHUB_USERNAME>/shop-micro-product-service:latest
          ports:
            - containerPort: 3002
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shop-micro
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 3002
