apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shop-micro
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: <DOCKERHUB_USERNAME>/shop-micro-order-service:latest
          ports:
            - containerPort: 3003
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shop-micro
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 3003
      targetPort: 3003
    